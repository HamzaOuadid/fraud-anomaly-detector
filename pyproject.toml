[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-anomaly-detector"
version = "0.1.0"
description = "Fraud/anomaly classifier whose decision threshold is chosen by sweeping the real $ cost of false positives vs. false negatives, not by optimizing F1 or accuracy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hamza Ouadid" }]
dependencies = [
    "typer>=0.12",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
fraud-detector = "fraud_anomaly_detector.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
