name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit + integration tests
        run: pytest tests/ -v

      - name: Run the full pipeline (small scale) and produce real evidence artifacts
        run: |
          fraud-detector run --n-samples 15000 --fraud-rate 0.02 --out-dir /tmp/ci-reports

      - name: Upload cost-vs-threshold evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fraud-detector-reports
          path: /tmp/ci-reports
